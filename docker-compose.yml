services:
  postgres:
    image: postgres:16-alpine
    container_name: ccnc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ccnc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: HyH5202
    ports:
      - '5432:5432'
    volumes:
      - ccnc_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ccnc-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - ccnc_redis_data:/data

volumes:
  ccnc_postgres_data:
  ccnc_redis_data:
